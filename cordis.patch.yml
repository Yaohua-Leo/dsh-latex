# dsh-latex bundle patch: the Host half of the LaTeX workspace.
#
# The `latex` row mounts index.js (apply) with the user-tunable config below.
# The browser half is auto-discovered from package.json's `dsh.client`
# declaration; the Host serves `client.js` through the plugin bundle route.
#
# Every field here can be overridden at the profile level, e.g.
#   - override:
#       - id: latex
#         config:
#           engine: lualatex
- insert:
    - id: latex
      name: '@yaohualiu/dsh-latex'
      config:
        # Directory holding latexmk.exe, xelatex.exe, ... Leave empty to
        # discover latexmk from PATH (or DSH_LATEX_TEX_BIN).
        texBinDir: ''
        # Empty -> <texBinDir>\latexmk.exe
        latexmkPath: ''
        # Default engine: xelatex | pdflatex | lualatex
        engine: xelatex
        # Build directory, relative to the project root (main .tex directory).
        buildDir: build
        # Watch project sources and rebuild after saves.
        autoBuild: true
        # Quiet period after the last change before a build starts.
        debounceMs: 800
        # Hard build timeout.
        timeoutMs: 180000
        # Keep the last successfully built PDF as the preview source.
        preserveLastGood: true
        # Auto-open the in-app preview after a successful explicit build.
        autoOpenPreview: true
        # 'native' (the plugin's PDF.js tab) or 'document' (DSH document preview).
        previewSurface: native
        # Entry allowlist for project main files (NOT a filesystem sandbox).
        # Empty = any local project root; UNC/network paths are always rejected.
        allowedRoots: []
        # Extra latexmk arguments appended verbatim (never shell-interpreted).
        extraLatexmkArgs: []
        # Maximum number of builds running at the same time (all projects).
        maxConcurrentBuilds: 2
        # Project rc files are executable Perl; true honours the project's own
        # recipe (never rewritten), false passes -norc. See README Security.
        allowProjectLatexmkrc: true
        # With a project rc present, do not force the configured engine flag.
        respectLatexmkrc: true
        # false -> pass -no-shell-escape (recommended); true lets TeX use
        # \write18, which means allowing project-controlled commands.
        allowShellEscape: false
        # Save + compile after the user stops typing in the editor. Set false
        # to require Ctrl+S / the triangle button.
        editorAutoSave: true
        # Quiet window for auto-save, in milliseconds (300..10000).
        editorAutoSaveDelayMs: 900
        # max_print_line for the TeX child; fewer wrapped log diagnostics.
        maxPrintLine: 2000
        # latex_look page rendering: default DPI (36..300), backend preference
        # ('auto' | 'pdftoppm' | 'ghostscript' | 'mutool'), and hard timeout.
        # pdftoppm ships with TeX Live; no npm dependency is added.
        renderDpi: 120
        renderEngine: auto
        renderTimeoutMs: 30000
        # Skip the pixel diff above this many pixels (one rendered page).
        lookMaxPixels: 4000000
        # Keep this many build hashes of rendered pages (2 keeps "diff vs previous").
        lookCacheKeep: 2
        # Preview annotations: item count and on-disk JSON size caps.
        annotationsMaxItems: 200
        annotationsMaxBytes: 262144
        # One annotation screenshot (PNG bytes) is capped separately.
        annotationImageMaxBytes: 5242880
        # Whole-document audit budget: pages, dpi and returned side-by-side images.
        auditMaxPages: 30
        auditDpi: 100
        auditMaxImages: 3
        # Screenshot questions are rejected above this base64-decoded size.
        askImageMaxBytes: 8388608
        # Optional local OCR for screenshot annotations.
        # ocrEnabled: auto | always | off (off disables all OCR).
        ocrEnabled: auto
        # OCR engine preference: auto (RapidOCR first, Tesseract fallback) |
        # rapidocr | tesseract | off.
        ocrEngine: auto
        # Python interpreter for the managed RapidOCR venv. Empty -> python/python3.
        ocrPython: ''
        # Where the managed venv lives. Empty -> ~/.dsh-latex/ocr. Set a D: path
        # on machines with a small C: drive; the install is about 150 MB.
        ocrInstallDir: ''
        ocrInstallTimeoutMs: 900000
        # Tesseract language string, e.g. 'eng' or 'eng+chi_sim' (fallback only).
        ocrLanguages: eng
        ocrTimeoutMs: 20000
